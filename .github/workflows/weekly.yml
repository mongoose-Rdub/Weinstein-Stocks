name: Weekly Weinstein screen

on:
  schedule:
    # Fridays 21:30 UTC = 3:30pm CST / 4:30pm CDT (both after the 3pm CT close)
    - cron: "30 21 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weinstein
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: |
          python test_pure.py
          python test_universe.py
      - name: Restore price cache (so each week only downloads the newest bars)
        uses: actions/cache/restore@v4
        with:
          path: .price_cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-
      - name: Run screener on the whole US market (adapts to Yahoo throttling)
        run: python weinstein_pure.py --universe all --time-budget 280 --feed weinstein_feed.json
      - name: Save price cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .price_cache
          key: prices-${{ github.run_id }}
      - name: Build dashboard
        run: |
          mkdir -p docs data
          python build_dashboard.py weinstein_feed.json docs/index.html
          cp weinstein_feed.json docs/weinstein_feed.json
      - name: Sanity check the data is this week's
        run: |
          python - <<'PY'
          import json, datetime as d
          f = json.load(open("weinstein_feed.json"))
          last = d.date.fromisoformat(f["last_bar"])
          age = (d.date.today() - last).days
          cv = f.get("coverage", {})
          print("last bar", last, "age days", age, "screened", f["screened"], "coverage", cv)
          assert age <= 6, "stale data"
          assert cv.get("analysed", 0) >= 0.5 * max(cv.get("universe", 1), 1), \
              "fewer than half the universe was analysed (Yahoo and Stooq both throttled?)"
          PY
      - name: Publish
        run: |
          git config user.name "weinstein-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs data
          git commit -m "Weekly screen $(date -u +%F)" || echo "no changes"
          git push

